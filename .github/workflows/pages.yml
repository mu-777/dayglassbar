name: pages-redirect

# The landing site moved from GitHub Pages to Cloudflare Workers
# (https://dayglassbar.mu-777.dev — see web/wrangler.toml and web/README.md).
# This workflow only keeps the OLD URL (https://mu-777.github.io/dayglassbar/...)
# alive by publishing a tiny redirect page there, so links already shared
# (README, SNS posts, OAuth consent screen, search results) still land on the
# new site. It does NOT publish web/ any more.
#
# GitHub Pages can't send HTTP redirects, so the page redirects with JS
# (path, query and hash are kept: /dayglassbar/privacy.html -> /privacy.html,
# which Cloudflare then 307s to /privacy) and falls back to a meta refresh to
# the top page. The same file is served as 404.html, so every old path is
# covered. Runs only when this file changes (or via Run workflow).

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Generate redirect page
        run: |
          mkdir -p _site
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <title>DayGlassBar has moved</title>
            <meta name="robots" content="noindex" />
            <link rel="canonical" href="https://dayglassbar.mu-777.dev/" />
            <script>
              (function () {
                var p = location.pathname.replace(/^\/dayglassbar/, '') || '/';
                location.replace('https://dayglassbar.mu-777.dev' + p + location.search + location.hash);
              })();
            </script>
            <meta http-equiv="refresh" content="0; url=https://dayglassbar.mu-777.dev/" />
          </head>
          <body>
            <p>DayGlassBar has moved to <a href="https://dayglassbar.mu-777.dev/">https://dayglassbar.mu-777.dev/</a>.</p>
          </body>
          </html>
          EOF
          cp _site/index.html _site/404.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
